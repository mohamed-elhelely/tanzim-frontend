  <script>
    // Apply the saved (or system) theme and language before Angular starts, so the page doesn't flash.
    (function () {
      try {
        var theme = localStorage.getItem('tanzim.theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        var lang = localStorage.getItem('tanzim.lang') === 'ar' ? 'ar' : 'en';
        root.lang = lang;
        root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
