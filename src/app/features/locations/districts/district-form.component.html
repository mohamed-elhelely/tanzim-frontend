<app-form-layout [title]="isEdit ? 'locations.districts.edit' : 'locations.districts.new'" (back)="goBack()">

  @if (loadError(); as err) {
    <app-error-state [title]="errorTitleKey(err)" [showRetry]="false"></app-error-state>
  } @else if (loading()) {
    <app-loading-state></app-loading-state>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6" novalidate>
      @if (formErrors().length) {
        <div
          role="alert"
          class="rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300"
        >
          @for (message of formErrors(); track $index) {
            <p>{{ message }}</p>
          }
        </div>
      }

      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1">
          <label for="name_en" class="text-sm font-medium">{{ 'company.fields.nameEn' | translate }} *</label>
          <input pInputText id="name_en" formControlName="name_en" class="w-full" />
          <app-field-error [control]="form.controls.name_en"></app-field-error>
        </div>

        <div class="flex flex-col gap-1">
          <label for="name_ar" class="text-sm font-medium">{{ 'company.fields.nameAr' | translate }}</label>
          <input pInputText id="name_ar" formControlName="name_ar" dir="rtl" class="w-full" />
          <app-field-error [control]="form.controls.name_ar"></app-field-error>
        </div>

        <div class="flex flex-col gap-1">
          <label for="city" class="text-sm font-medium">{{ 'locations.fields.city' | translate }} *</label>
          <p-select
            inputId="city"
            formControlName="city"
            [options]="cityOptions()"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            [showClear]="false"
            [placeholder]="'common.select' | translate"
            styleClass="w-full"
            appendTo="body"
          ></p-select>
          <app-field-error [control]="form.controls.city"></app-field-error>
        </div>

        <div class="flex flex-col gap-1">
          <label for="postal_code_prefix" class="text-sm font-medium">{{ 'locations.fields.postalCodePrefix' | translate }}</label>
          <input pInputText id="postal_code_prefix" formControlName="postal_code_prefix" dir="ltr" class="w-full" />
          <app-field-error [control]="form.controls.postal_code_prefix" patternKey="locations.hints.postalCodePrefix"></app-field-error>
        </div>
      </div>

      <div class="flex justify-end gap-2 border-t border-gray-100 pt-5 dark:border-gray-800">
        <p-button
          type="button"
          [label]="'common.cancel' | translate"
          severity="secondary"
          [outlined]="true"
          (onClick)="goBack()"
        ></p-button>
        <p-button
          type="submit"
          [label]="'common.save' | translate"
          icon="pi pi-check"
          [loading]="saving()"
          [disabled]="saving()"
        ></p-button>
      </div>
    </form>
  }
</app-form-layout>
