<app-page-header title="nav.notifications" [actions]="headerActions()"></app-page-header>

<div class="max-w-3xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900">
  <div class="flex items-center gap-3 border-b border-gray-100 p-4 dark:border-gray-800">
    <p-selectbutton
      [options]="filterOptions"
      [ngModel]="filter()"
      (ngModelChange)="filter.set($event)"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      size="small"
    >
      <ng-template pTemplate="item" let-option>{{ option.label | translate }}</ng-template>
    </p-selectbutton>
  </div>
  <div class="flex flex-col gap-0.5 p-2">
    @for (item of shown(); track item.id) {
      <app-notification-item [notification]="item" (open)="open($event)"></app-notification-item>
    } @empty {
      <app-empty-state icon="pi-bell" title="notifications.empty"></app-empty-state>
    }
  </div>
</div>
