<div class="flex min-h-screen bg-[var(--app-bg)] text-gray-900 dark:text-gray-100">
  <aside class="w-56 shrink-0 border-e border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900">
    <p class="mb-1 text-lg font-bold">UI components</p>
    <p class="mb-4 text-xs text-gray-500 dark:text-gray-400">shared/ui · development only</p>
    <nav class="flex flex-col gap-1" aria-label="Component pages">
      @for (page of pages; track page.path) {
        <a
          [routerLink]="page.path"
          routerLinkActive="bg-primary-50 font-semibold text-primary-700 dark:bg-primary-500/15 dark:text-primary-200"
          class="rounded-lg px-3 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-800"
          >{{ page.label }}</a
        >
      }
    </nav>
  </aside>

  <div class="min-w-0 flex-1">
    <header
      class="flex items-center justify-end gap-2 border-b border-gray-200 bg-white px-6 py-3 dark:border-gray-800 dark:bg-gray-900"
    >
      <button
        type="button"
        class="rounded-lg px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-800"
        (click)="language.toggle()"
      >
        {{ language.currentLang() === 'en' ? 'العربية (RTL)' : 'English (LTR)' }}
      </button>
      <button
        type="button"
        class="rounded-lg px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-800"
        (click)="theme.toggle()"
      >
        {{ theme.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
      </button>
    </header>
    <main class="p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
