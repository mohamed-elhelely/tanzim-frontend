<section class="mb-8 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-gray-900">
  <h2 class="text-base font-semibold">{{ heading() }}</h2>
  @if (note(); as text) {
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ text }}</p>
  }
  <div class="mt-4 flex flex-wrap items-start gap-3">
    <ng-content></ng-content>
  </div>
  @if (code(); as markup) {
    <pre
      dir="ltr"
      class="mt-4 overflow-x-auto rounded-lg bg-gray-50 p-3 text-start text-xs text-gray-700 dark:bg-gray-950 dark:text-gray-300"
    ><code>{{ markup }}</code></pre>
  }
</section>
