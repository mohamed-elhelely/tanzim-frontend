<h1 class="mb-6 text-2xl font-bold">Cards <span class="text-base font-normal text-gray-500">app-card</span></h1>

<app-showcase-section heading="Basic" note="Any content; the card adds the surface, border and padding." [code]="code.basic">
  <app-card class="w-full max-w-md">
    <h3 class="text-base font-semibold">Order SO-2026-0042</h3>
    <dl class="mt-3 grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
      <dt class="text-gray-500">Customer</dt>
      <dd>Delta Trading</dd>
      <dt class="text-gray-500">Total</dt>
      <dd dir="ltr" class="text-start">12,500.00</dd>
    </dl>
  </app-card>
</app-showcase-section>

<app-showcase-section heading="In a grid" note="Layout classes on the element place the card (col-span)." [code]="code.grid">
  <div class="grid w-full gap-4 lg:grid-cols-3">
    <app-card class="lg:col-span-2">
      <p class="text-sm">Two columns wide on large screens.</p>
    </app-card>
    <app-card>
      <p class="text-sm">One column.</p>
      <app-button label="Action" size="small" class="mt-3"></app-button>
    </app-card>
  </div>
</app-showcase-section>
