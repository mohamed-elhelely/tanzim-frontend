<p-password
  [ngModel]="value() ?? ''"
  (ngModelChange)="set($event)"
  (onBlur)="blur()"
  [disabled]="isDisabled()"
  [inputId]="inputId()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [feedback]="false"
  [toggleMask]="true"
  styleClass="w-full"
  inputStyleClass="w-full"
></p-password>
