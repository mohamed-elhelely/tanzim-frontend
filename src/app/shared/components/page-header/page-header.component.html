<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <div class="min-w-0">
    @if (showBack) {
      <button
        type="button"
        class="mb-2 inline-flex items-center gap-1.5 text-sm font-medium text-gray-500 transition-colors hover:text-primary-600 dark:text-gray-400 dark:hover:text-primary-300"
        (click)="back.emit()"
      >
        <i class="pi pi-arrow-left text-xs rtl:rotate-180"></i>
        {{ backLabel | translate }}
      </button>
    }
    <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">{{ title | translate }}</h1>
    @if (subtitle) {
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ subtitle | translate }}</p>
    }
  </div>
  @if (actions.length) {
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      @for (action of actions; track action.label) {
        <p-button
          [label]="action.label | translate"
          [icon]="action.icon"
          [severity]="action.severity ?? 'primary'"
          [disabled]="action.disabled ?? false"
          (onClick)="action.onClick()"
        ></p-button>
      }
    </div>
  }
</div>
