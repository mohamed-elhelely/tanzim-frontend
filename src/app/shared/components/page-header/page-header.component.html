<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">{{ title | translate }}</h1>
    @if (subtitle) {
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ subtitle | translate }}</p>
    }
  </div>
  <div class="flex items-center gap-2">
    @if (showBack) {
      <p-button
        [label]="backLabel | translate"
        icon="pi pi-arrow-left"
        severity="secondary"
        [outlined]="true"
        (onClick)="back.emit()"
      ></p-button>
    }
    @for (action of actions; track action.label) {
      <p-button
        [label]="action.label | translate"
        [icon]="action.icon"
        [severity]="action.severity ?? 'primary'"
        [disabled]="action.disabled ?? false"
        (onClick)="action.onClick()"
      ></p-button>
    }
  </div>
</div>
