<div class="flex flex-col items-center justify-center py-12 gap-4 text-center">
  <i [class]="'pi ' + icon + ' text-6xl text-gray-400'"></i>
  <div>
    <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">{{ title | translate }}</h3>
    <p *ngIf="message" class="text-sm text-gray-500 dark:text-gray-400 mt-2">{{ message | translate }}</p>
  </div>
</div>
