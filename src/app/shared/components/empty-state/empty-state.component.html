<div class="flex flex-col items-center justify-center gap-3 px-4 py-12 text-center">
  <span
    class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary-50 text-primary-500 dark:bg-primary-950 dark:text-primary-300"
  >
    <i [class]="'pi ' + icon + ' text-2xl'"></i>
  </span>
  <div>
    <h3 class="text-base font-semibold text-gray-900 dark:text-gray-100">{{ title | translate }}</h3>
    @if (message) {
      <p class="mt-1 max-w-sm text-sm text-gray-500 dark:text-gray-400">{{ message | translate }}</p>
    }
  </div>
  <ng-content></ng-content>
</div>
