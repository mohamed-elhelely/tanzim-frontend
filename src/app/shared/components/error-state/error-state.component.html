<div
  class="flex flex-col items-center justify-center gap-3 rounded-2xl border border-gray-200 bg-white px-4 py-12 text-center dark:border-gray-800 dark:bg-gray-900"
>
  <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-red-50 text-red-500 dark:bg-red-950 dark:text-red-300">
    <i class="pi pi-exclamation-triangle text-2xl"></i>
  </span>
  <div>
    <h3 class="text-base font-semibold text-gray-900 dark:text-gray-100">{{ title | translate }}</h3>
    @if (message) {
      <p class="mt-1 max-w-sm text-sm text-gray-500 dark:text-gray-400">{{ message | translate }}</p>
    }
  </div>
  @if (showRetry) {
    <p-button
      [label]="'common.retry' | translate"
      icon="pi pi-refresh"
      severity="secondary"
      [outlined]="true"
      (onClick)="retry.emit()"
    ></p-button>
  }
</div>
