<app-dialog
  [header]="header | translate"
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [dismissable]="true"
  width="32rem"
>
  <div class="flex flex-col gap-1">
    <label for="reason_dialog_text" class="text-sm font-medium">{{ label | translate }}</label>
    <textarea pTextarea id="reason_dialog_text" [(ngModel)]="reason" rows="3" class="w-full"></textarea>
  </div>
  <ng-template appDialogFooter>
    <p-button [label]="'common.cancel' | translate" severity="secondary" [outlined]="true" (onClick)="close()"></p-button>
    <p-button [label]="confirmLabel | translate" severity="danger" (onClick)="confirm()"></p-button>
  </ng-template>
</app-dialog>
