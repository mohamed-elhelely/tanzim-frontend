<button
  type="button"
  class="flex w-full items-start gap-3 rounded-xl px-3 py-2.5 text-start transition-colors hover:bg-gray-50 dark:hover:bg-gray-800/60"
  [class.bg-primary-50/60]="!notification.is_read"
  [class.dark:bg-primary-500/5]="!notification.is_read"
  (click)="open.emit(notification)"
>
  <span [class]="'flex h-9 w-9 shrink-0 items-center justify-center rounded-lg ' + style.tone">
    <i [class]="'pi ' + style.icon"></i>
  </span>
  <span class="min-w-0 flex-1">
    <span class="flex items-center gap-2">
      <span class="truncate text-sm font-semibold text-gray-900 dark:text-gray-100">{{ notification.title }}</span>
      @if (!notification.is_read) {
        <span class="h-2 w-2 shrink-0 rounded-full bg-primary-500" aria-hidden="true"></span>
      }
    </span>
    <span class="mt-0.5 block text-sm text-gray-600 dark:text-gray-300" dir="auto">{{ notification.message }}</span>
    <span class="mt-1 block text-xs text-gray-400">{{ notification.created_at | timeAgo: lang() }}</span>
  </span>
</button>
