@if (table().canRestore()) {
  <p-button
    [label]="'views.title' | translate"
    icon="pi pi-bookmark"
    severity="secondary"
    [outlined]="true"
    (onClick)="toggle($event, popover)"
    styleClass="w-full sm:w-auto"
  ></p-button>

  <p-popover #popover appendTo="body">
    <div class="flex w-72 flex-col gap-3">
      @if (views().length) {
        <ul class="flex max-h-64 flex-col gap-1 overflow-y-auto">
          @for (view of views(); track view.name) {
            <li class="flex items-center gap-1">
              <button
                type="button"
                class="flex-1 truncate rounded-md px-2 py-1.5 text-start text-sm hover:bg-gray-100 dark:hover:bg-gray-800"
                (click)="show(view, popover)"
              >
                <i class="pi pi-bookmark-fill me-2 text-xs text-primary-500"></i>{{ view.name }}
              </button>
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                [rounded]="true"
                size="small"
                [ariaLabel]="'common.delete' | translate"
                (onClick)="remove(view)"
              ></p-button>
            </li>
          }
        </ul>
      } @else {
        <p class="text-sm text-gray-500 dark:text-gray-400">{{ 'views.empty' | translate }}</p>
      }

      <div class="flex flex-col gap-2 border-t border-gray-100 pt-3 dark:border-gray-800">
        <input
          pInputText
          type="text"
          maxlength="60"
          [placeholder]="'views.namePlaceholder' | translate"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          (keydown.enter)="save()"
          [disabled]="!table().filtered()"
          class="w-full"
        />
        <p-button
          [label]="'views.save' | translate"
          icon="pi pi-save"
          size="small"
          [disabled]="!canSave()"
          (onClick)="save()"
        ></p-button>
        @if (!table().filtered()) {
          <p class="text-xs text-gray-500 dark:text-gray-400">{{ 'views.applyFirst' | translate }}</p>
        }
      </div>
    </div>
  </p-popover>
}
