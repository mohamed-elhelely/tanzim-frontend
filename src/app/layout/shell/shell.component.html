<div class="flex h-screen w-full overflow-hidden">
  <app-sidebar class="hidden shrink-0 lg:block"></app-sidebar>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-header (menuToggle)="openMobileNav()"></app-header>
    <app-loading-bar></app-loading-bar>
    <main class="flex-1 overflow-y-auto">
      <div class="mx-auto w-full max-w-screen-2xl px-4 py-6 md:px-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>

<p-drawer
  [visible]="mobileNavOpen()"
  (visibleChange)="mobileNavOpen.set($event)"
  [showCloseIcon]="true"
  [modal]="true"
  [position]="language.direction() === 'rtl' ? 'right' : 'left'"
  styleClass="app-nav-drawer w-72"
>
  <ng-template pTemplate="header">
    <app-brand></app-brand>
  </ng-template>
  <app-nav-list (itemSelected)="closeMobileNav()"></app-nav-list>
</p-drawer>

<p-toast [position]="language.direction() === 'rtl' ? 'top-left' : 'top-right'"></p-toast>
<app-confirm-dialog></app-confirm-dialog>
