<div class="flex h-screen w-full overflow-hidden bg-gray-50 dark:bg-gray-900">
  <app-sidebar class="hidden shrink-0 lg:block"></app-sidebar>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-header (menuToggle)="openMobileNav()"></app-header>
    <app-loading-bar></app-loading-bar>
    <main class="flex-1 overflow-y-auto p-4 md:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<p-sidebar
  [visible]="mobileNavOpen()"
  (visibleChange)="mobileNavOpen.set($event)"
  [showCloseIcon]="true"
  [modal]="true"
  styleClass="w-72"
>
  <div class="flex items-center gap-2 border-b border-gray-200 pb-4 dark:border-gray-700">
    <i class="pi pi-box text-xl text-primary-600"></i>
    <span class="text-lg font-semibold text-gray-800 dark:text-gray-100">{{ 'app.name' | translate }}</span>
  </div>
  <app-nav-list (itemSelected)="closeMobileNav()"></app-nav-list>
</p-sidebar>

<p-toast position="top-right"></p-toast>
