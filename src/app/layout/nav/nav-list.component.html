<nav class="flex flex-col gap-1 pb-4 pt-2" [class.px-3]="!collapsed()" [class.px-2]="collapsed()">
  @for (item of items(); track item.routerLink) {
    @if (item.children) {
      <button
        type="button"
        [class]="linkClasses + ' w-full' + (isActiveGroup(item) ? ' !text-white' : '') + (collapsed() && isActiveGroup(item) ? ' bg-white/10' : '')"
        [class.justify-center]="collapsed()"
        [attr.aria-expanded]="collapsed() ? null : isExpanded(item)"
        [pTooltip]="collapsed() ? (item.labelKey | translate) : undefined"
        [tooltipPosition]="direction() === 'rtl' ? 'left' : 'right'"
        (click)="toggle(item)"
      >
        <i [class]="item.icon + ' text-base'"></i>
        <span class="flex-1 whitespace-nowrap text-start" [class.sr-only]="collapsed()">{{ item.labelKey | translate }}</span>
        @if (!collapsed()) {
          <i
            class="pi text-xs"
            [class.pi-chevron-down]="isExpanded(item)"
            [class.pi-chevron-right]="!isExpanded(item) && direction() === 'ltr'"
            [class.pi-chevron-left]="!isExpanded(item) && direction() === 'rtl'"
          ></i>
        }
      </button>
      @if (isExpanded(item) && !collapsed()) {
        <div class="ms-5 flex flex-col gap-0.5 border-s border-white/10 ps-2">
          @for (child of item.children; track child.routerLink) {
            <a
              [routerLink]="child.routerLink"
              [routerLinkActive]="activeClasses"
              [class]="linkClasses"
              (click)="itemSelected.emit()"
            >
              <i [class]="child.icon + ' text-sm'"></i>
              <span class="whitespace-nowrap">{{ child.labelKey | translate }}</span>
            </a>
          }
        </div>
      }
    } @else {
      <a
        [routerLink]="item.routerLink"
        [routerLinkActive]="activeClasses"
        [class]="linkClasses"
        [class.justify-center]="collapsed()"
        [pTooltip]="collapsed() ? (item.labelKey | translate) : undefined"
        [tooltipPosition]="direction() === 'rtl' ? 'left' : 'right'"
        (click)="itemSelected.emit()"
      >
        <i [class]="item.icon + ' text-base'"></i>
        <span class="whitespace-nowrap" [class.sr-only]="collapsed()">{{ item.labelKey | translate }}</span>
      </a>
    }
  }
</nav>
